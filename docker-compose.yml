name: my-docker-project

services:
  app:
    build: .
    image: my-docker-image
    container_name: my-docker-container
    command: sh /app/entrypoint.sh
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - ./_core/.env
    depends_on:
      - postgres
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Kjh_54(?
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  celery:
    image: my-docker-image
    container_name: celery
    command: celery -A _core worker -l info
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app
    env_file:
      - ./_core/.env
  
  flower:
    image: my-docker-image
    container_name: my-flower-container
    command: celery -A _core flower --broker=redis://redis:6379/0 --address=0.0.0.0
    depends_on:
      - redis
    ports:
      - "5555:5555"
    env_file:
      - ./_core/.env
   
    
  beat:
    image: my-docker-image
    container_name: my-beat-container
    command: celery -A _core beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    depends_on:
      - redis
      - app
    volumes:
      - .:/app
    env_file:
      - ./_core/.env

volumes:
  postgres_data:
  redis_data: